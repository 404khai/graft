[package]
name = "graft-cli"
description = "The graft command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "graft"
path = "src/main.rs"

# End-to-end tests live at the workspace root (AGENTS.md §5) but are owned by
# this package so Cargo builds the `graft` binary and sets CARGO_BIN_EXE_graft.
[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
graft-blueprint.workspace = true
graft-core.workspace = true
graft-daemon.workspace = true
graft-fs.workspace = true
graft-integrate.workspace = true
graft-mcp.workspace = true
graft-radar.workspace = true
graft-root.workspace = true
graft-sandbox.workspace = true
graft-sched.workspace = true
serde.workspace = true
serde_json.workspace = true
graft-store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[features]
# End-to-end tests that mount FUSE grafts (Linux). Also need GRAFT_TEST_FUSE=1.
fuse-tests = []
# End-to-end tests that mount NFS grafts (macOS). Also need GRAFT_TEST_NFS=1.
nfs-tests = []

[lints]
workspace = true
