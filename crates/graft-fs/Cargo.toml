[package]
name = "graft-fs"
description = "Filesystem backends for grafts and host filesystem probing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tests that need loop-mounted filesystems prepared by root. Also require
# $GRAFT_TEST_FS_MOUNTS; see tests/privileged.rs.
privileged-tests = []
# Tests that mount FUSE filesystems (Linux, /dev/fuse and fusermount3).
# Also require $GRAFT_TEST_FUSE=1; see tests/fuse_backend.rs.
fuse-tests = []

[dependencies]
graft-core.workspace = true
graft-root.workspace = true
graft-store.workspace = true
libc.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true

[lints]
workspace = true
