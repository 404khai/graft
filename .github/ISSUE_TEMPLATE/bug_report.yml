name: Bug report
description: Something in Graft does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not open an issue: see the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste exact error output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands that shows it.
      placeholder: |
        graft init
        graft new a
        ...
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: graft doctor
      description: The output of `graft doctor` run in the repository.
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostics bundle
      description: Run `graft doctor --report` in the repository and attach the file it names (drag it here). Read it first; secret-looking values are redacted, but it names paths on your machine. Leave this empty if you would rather not share it.
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - reflink (default)
        - fuse (Linux)
        - nfs (macOS)
        - not sure
    validations:
      required: true
  - type: dropdown
    id: via
    attributes:
      label: Used through
      options:
        - CLI
        - MCP (graft mcp)
        - both
  - type: input
    id: version
    attributes:
      label: graft --version
      placeholder: graft 0.1.1
    validations:
      required: true
