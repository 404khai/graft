name: Bench

# Benchmarks never gate merges (AGENTS.md §6). They run on demand, and on
# pull requests labelled `bench`.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Times to repeat the harness matrix
        default: "3"
      agents:
        description: Agent counts for the harness matrix
        default: "1,4,8,16"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  graft-disk:
    name: graft disk use (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'bench')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p graft-cli
      - name: Mount btrfs, xfs and ext4 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y btrfs-progs xfsprogs
          # 1 GiB tree plus its git objects and a graft: 4 GiB images.
          sudo env SIZE=4G scripts/mount-test-filesystems.sh "$RUNNER_TEMP/graft-fs" "$(id -u):$(id -g)"
      - name: Measure (Linux)
        if: runner.os == 'Linux'
        run: |
          for fs in btrfs xfs ext4; do
            echo "### $fs" >> "$GITHUB_STEP_SUMMARY"
            scripts/measure-graft-disk.sh "$RUNNER_TEMP/graft-fs/mnt/$fs" 1024 10000 | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Measure (macOS, APFS)
        if: runner.os == 'macOS'
        run: |
          echo "### apfs" >> "$GITHUB_STEP_SUMMARY"
          scripts/measure-graft-disk.sh "$RUNNER_TEMP/graft-bench" 1024 10000 | tee -a "$GITHUB_STEP_SUMMARY"

  harness:
    # The full matrix takes hours: on demand only, never on every push.
    name: benchmark harness (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # XFS: reflinks like btrfs, but free space is reported exactly (btrfs
      # allocates in chunks, which makes free-space deltas jump).
      - name: Mount a dedicated XFS volume on the large /mnt disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y btrfs-progs xfsprogs
          sudo mkdir -p /mnt/graft-bench && sudo chown "$(id -u):$(id -g)" /mnt/graft-bench
          sudo env SIZE=60G scripts/mount-test-filesystems.sh /mnt/graft-bench "$(id -u):$(id -g)"
          df -h /mnt/graft-bench/mnt/xfs
      - name: Run (Linux, XFS)
        if: runner.os == 'Linux'
        run: >
          bench/run.sh --work /mnt/graft-bench/mnt/xfs
          --runs "${{ inputs.runs }}" --agents "${{ inputs.agents }}"
          --machine "GitHub Actions ubuntu-latest runner"
      # The runner's own APFS disk: a sparse image inside the VM was too slow
      # to finish in the job limit. Large is limited to 1 and 4 agents (one
      # 16-agent large cell alone took longer than an hour there).
      - name: Run (macOS, APFS)
        if: runner.os == 'macOS'
        run: |
          bench/run.sh --work "$RUNNER_TEMP/graft-bench" --label macos-arm64-apfs \
            --fixtures small,medium --runs "${{ inputs.runs }}" --agents "${{ inputs.agents }}" \
            --machine "GitHub Actions macos-latest runner"
          mv bench/results/macos-arm64-apfs bench/results/macos-arm64-apfs-small-medium
          bench/run.sh --work "$RUNNER_TEMP/graft-bench" --label macos-arm64-apfs \
            --fixtures large --runs "${{ inputs.runs }}" --agents 1,4 \
            --machine "GitHub Actions macos-latest runner (large: 1 and 4 agents only)"
          mv bench/results/macos-arm64-apfs bench/results/macos-arm64-apfs-large
      - name: Summary
        if: always()
        run: cat bench/results/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-${{ matrix.os }}
          path: bench/results/
