name: Homebrew tap

# When a release is published, copy its graft.rb (generated by the release
# workflow) into 404khai/homebrew-graft, so `brew install 404khai/graft/graft`
# gets it. Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with
# Contents read and write on 404khai/homebrew-graft only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the formula of (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern graft.rb
      # A plain clone, not actions/checkout: the tap may still be empty
      # (no branch yet), which checkout cannot handle.
      - name: Clone the tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/404khai/homebrew-graft.git" tap
          git -C tap checkout -B main
      - name: Commit it to the tap
        run: |
          mkdir -p tap/Formula
          cp graft.rb tap/Formula/graft.rb
          cd tap
          if [ ! -f README.md ]; then
            printf '%s\n' \
              '# homebrew-graft' \
              '' \
              'Homebrew tap for [Graft](https://github.com/404khai/graft): copy-on-write workspaces for parallel coding agents.' \
              '' \
              '```sh' \
              'brew install 404khai/graft/graft' \
              '```' \
              '' \
              'The formula is updated automatically when a Graft release is published.' > README.md
            git add README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/graft.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git commit -m "graft ${TAG#v}"
          git push origin main
