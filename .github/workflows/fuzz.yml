      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/download-artifact@v7
        with:
          name: corpus-1-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
      - name: Fuzz
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          # The prebuilt cargo-fuzz is a musl binary and would default to musl,
          # which AddressSanitizer cannot instrument.
