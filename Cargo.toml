[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/404khai/graft"
publish = false

[workspace.dependencies]
# Internal crates. Crates depend downward only (see AGENTS.md §5).
graft-core = { path = "crates/graft-core" }
graft-root = { path = "crates/graft-root" }
graft-store = { path = "crates/graft-store" }
graft-fs = { path = "crates/graft-fs" }
graft-sandbox = { path = "crates/graft-sandbox" }
graft-blueprint = { path = "crates/graft-blueprint" }
graft-radar = { path = "crates/graft-radar" }
graft-integrate = { path = "crates/graft-integrate" }
graft-sched = { path = "crates/graft-sched" }
graft-daemon = { path = "crates/graft-daemon" }
graft-mcp = { path = "crates/graft-mcp" }

# External crates. Every addition is justified in its PR.
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
fuser = { version = "0.18.0", default-features = false }
getrandom = "0.4.3"
gix = { version = "0.90.0", default-features = false, features = ["parallel", "revision", "sha1", "status"] }
landlock = "0.4.7"
libc = "0.2.191"
nfsserve = "0.11.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Test-only.
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
